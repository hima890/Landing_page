name: Build, Test & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (TypeScript type-check)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          echo "${{ secrets.SSH_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: Create .env.local on server
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          cat > ${{ secrets.DEPLOY_PATH }}/.env.local << 'EOF'
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SECRET=${{ secrets.ADMIN_SECRET }}
          APP_URL=${{ secrets.APP_URL }}
          VITE_GOOGLE_SHEETS_WEBHOOK_URL=${{ secrets.VITE_GOOGLE_SHEETS_WEBHOOK_URL }}
          EOF
          chmod 600 ${{ secrets.DEPLOY_PATH }}/.env.local
          "

      - name: Sync source files to server
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env*' \
            --exclude='*.db' \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }}" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Install production dependencies & restart server
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
          export NVM_DIR=\$HOME/.nvm
          [ -s \$NVM_DIR/nvm.sh ] && . \$NVM_DIR/nvm.sh

          cd ${{ secrets.DEPLOY_PATH }}

          npm ci --omit=dev

          # Load environment variables
          export \$(cat .env.local | xargs)

          # Start or restart PM2
          if pm2 describe aventa-app > /dev/null 2>&1; then
            pm2 restart aventa-app
          else
            NODE_ENV=production pm2 start server.ts --name aventa-app --interpreter tsx
          fi

          pm2 save
          "
